name: Test and deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: cpanel-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    # ponytail: kembali ke runner GitHub sampai self-hosted devserver siap.
    runs-on: ubuntu-latest
    env:
      REPOSITORY_PATH: ${{ github.ref_name == 'main' && '/home/pixelkom/repositories/store.pixelkomunika.com' || '/home/pixelkom/repositories/dev.store.pixelkomunika.com' }}
      CPANEL_USER: pixelkom
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, mbstring, pdo_sqlite, zip

      - run: composer install --no-interaction --prefer-dist --no-progress
      # NFR-SEC-010: gagalkan deploy bila ada advisory dependency
      - run: composer audit
      - run: npm audit --audit-level=high
      - run: php artisan test

      # Build aset di sini; task deploy cPanel (ulimit -v 4 GB) OOM saat build Vite.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build && tar -czf build.tgz -C public build

      - name: Update and deploy through cPanel API
        env:
          CPANEL_API_BASE_URL: ${{ secrets[format('{0}_CPANEL_API_BASE_URL', ((github.ref_name == 'main' && 'production' || 'staging') == 'production' && 'PRODUCTION' || 'STAGING'))] }}
          CPANEL_API_TOKEN: ${{ secrets[format('{0}_CPANEL_API_TOKEN', ((github.ref_name == 'main' && 'production' || 'staging') == 'production' && 'PRODUCTION' || 'STAGING'))] }}
        run: |
          # Tarik commit terbaru ke clone server; tanpa ini cPanel men-deploy HEAD lama.
          head="$(curl --fail-with-body --silent --show-error --get \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
            --data-urlencode "repository_root=$REPOSITORY_PATH" \
            --data-urlencode "branch=$GITHUB_REF_NAME" \
            "$CPANEL_API_BASE_URL/execute/VersionControl/update" \
            | jq -r '(.result.data // .data).last_update.identifier')"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "HEAD repo server $head, bukan $GITHUB_SHA; cek kredensial remote di cPanel Git Version Control." >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
            -F "dir=/home/pixelkom/tmp" -F "overwrite=1" \
            -F "file-1=@build.tgz;filename=build-$GITHUB_SHA.tgz" \
            "$CPANEL_API_BASE_URL/execute/Fileman/upload_files" \
            | jq -e '((.result.status // .status) == 1) and (((.result.data // .data).failed // 0) == 0)'

          response="$(curl --fail-with-body --silent --show-error --get \
            -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
            --data-urlencode "repository_root=$REPOSITORY_PATH" \
            "$CPANEL_API_BASE_URL/execute/VersionControlDeployment/create")"
          if ! printf '%s\n' "$response" | jq .; then
            printf '%s\n' "$response"
            exit 1
          fi
          printf '%s\n' "$response" | jq -e '(.result.status // .status) == 1'
          echo "DEPLOY_ID=$(printf '%s\n' "$response" | jq -r '(.result.data // .data).deploy_id')" >> "$GITHUB_ENV"

      # cPanel menerima permintaan deploy lalu bisa gagal/menolak diam-diam
      # (mis. file untracked di repo server); tunggu hasil sebenarnya.
      - name: Wait for cPanel deployment result
        env:
          CPANEL_API_BASE_URL: ${{ secrets[format('{0}_CPANEL_API_BASE_URL', ((github.ref_name == 'main' && 'production' || 'staging') == 'production' && 'PRODUCTION' || 'STAGING'))] }}
          CPANEL_API_TOKEN: ${{ secrets[format('{0}_CPANEL_API_TOKEN', ((github.ref_name == 'main' && 'production' || 'staging') == 'production' && 'PRODUCTION' || 'STAGING'))] }}
        run: |
          for _ in $(seq 60); do
            deployment="$(curl --fail-with-body --silent --show-error --get \
              -H "Authorization: cpanel $CPANEL_USER:$CPANEL_API_TOKEN" \
              "$CPANEL_API_BASE_URL/execute/VersionControlDeployment/retrieve" \
              | jq -c --arg id "$DEPLOY_ID" '(.result.data // .data)[] | select((.deploy_id | tostring) == $id)')"
            if printf '%s' "$deployment" | jq -e '.timestamps.succeeded' >/dev/null; then
              echo "Deploy $DEPLOY_ID berhasil."
              exit 0
            fi
            if printf '%s' "$deployment" | jq -e '.timestamps.failed // .timestamps.canceled' >/dev/null; then
              echo "Deploy $DEPLOY_ID gagal; cek log cPanel: $(printf '%s' "$deployment" | jq -r '.log_path')" >&2
              exit 1
            fi
            sleep 10
          done
          echo "Deploy $DEPLOY_ID tidak selesai dalam 10 menit; cek repo server (git status) dan log cPanel." >&2
          exit 1

      - name: Health check
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 "https://${{ github.ref_name == 'main' && 'store.pixelkomunika.com' || 'dev.store.pixelkomunika.com' }}/health" | jq -e '.status == "ok"'

---
deployment:
  tasks:
    - |
      set -euo pipefail

      BRANCH="$(git rev-parse --abbrev-ref HEAD)"
      REPOSITORY="$(git rev-parse --show-toplevel)"
      PHP=/usr/local/bin/php
      COMPOSER=/home/pixelkom/bin/composer

      case "$BRANCH" in
        main)
          EXPECTED_REPOSITORY=/home/pixelkom/repositories/store.pixelkomunika.com
          DEPLOYPATH=/home/pixelkom/public_html/store.pixelkomunika.com
          RUN_MIGRATIONS=false
          ;;
        staging)
          EXPECTED_REPOSITORY=/home/pixelkom/repositories/dev.store.pixelkomunika.com
          DEPLOYPATH=/home/pixelkom/public_html/dev.store.pixelkomunika.com
          RUN_MIGRATIONS=true
          ;;
        *)
          echo "Deployment ditolak: branch '$BRANCH' bukan main atau staging." >&2
          exit 1
          ;;
      esac

      if [ "$REPOSITORY" != "$EXPECTED_REPOSITORY" ]; then
        echo "Deployment ditolak: branch '$BRANCH' harus berasal dari '$EXPECTED_REPOSITORY', bukan '$REPOSITORY'." >&2
        exit 1
      fi

      if [ ! -f "$DEPLOYPATH/.env" ]; then
        echo "Deployment ditolak: '$DEPLOYPATH/.env' tidak ditemukan." >&2
        exit 1
      fi

      PHP_REFERENCE_DIR="$DEPLOYPATH/public"

      [ -x "$PHP" ] || { echo "PHP CLI cPanel tidak ditemukan di '$PHP'." >&2; exit 1; }
      [ -f "$COMPOSER" ] || { echo "Composer tidak ditemukan di '$COMPOSER'." >&2; exit 1; }

      PHP_MODULES="$("$PHP" --ea-reference-dir="$PHP_REFERENCE_DIR" -m)"
      for EXTENSION in curl fileinfo iconv pdo_mysql zip; do
        printf '%s\n' "$PHP_MODULES" | grep -qx "$EXTENSION" || {
          echo "Extension PHP '$EXTENSION' tidak aktif untuk '$DEPLOYPATH'." >&2
          exit 1
        }
      done

      # Aset Vite di-build oleh GitHub Actions (task cPanel dibatasi ulimit -v 4 GB
      # sehingga build di server OOM) lalu di-upload sebagai build-<commit>.tgz.
      ARTIFACT="/home/pixelkom/tmp/build-$(git rev-parse HEAD).tgz"
      [ -f "$ARTIFACT" ] || { echo "Artefak build '$ARTIFACT' tidak ditemukan." >&2; exit 1; }

      echo "Deploying branch '$BRANCH' ke '$DEPLOYPATH'..."
      git archive --format=tar HEAD | tar -xf - -C "$DEPLOYPATH"

      cd "$DEPLOYPATH"
      "$PHP" --ea-reference-dir="$PHP_REFERENCE_DIR" "$COMPOSER" install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      rm -rf public/build
      tar -xzf "$ARTIFACT" -C public
      rm -f "$ARTIFACT"
      "$PHP" --ea-reference-dir="$PHP_REFERENCE_DIR" artisan optimize:clear
      "$PHP" --ea-reference-dir="$PHP_REFERENCE_DIR" artisan storage:link

      if [ "$RUN_MIGRATIONS" = true ]; then
        "$PHP" --ea-reference-dir="$PHP_REFERENCE_DIR" artisan migrate --force
      fi

      "$PHP" --ea-reference-dir="$PHP_REFERENCE_DIR" artisan optimize
      echo "Deployment branch '$BRANCH' selesai."
